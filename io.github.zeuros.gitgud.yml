app-id: io.github.zeuros.gitgud
# Tauri app: the GNOME runtime provides WebKitGTK 4.1, GTK 3 and libsoup 3 the binary links to
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: gitgud
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --share=network
  - --device=dri
  - --filesystem=home
  - --socket=ssh-auth
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.OpenURI
  - --talk-name=org.freedesktop.portal.FileChooser

modules:
  - name: gitgud
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/gitgud /app/bin/gitgud
      - install -Dm644 io.github.zeuros.gitgud.desktop
          /app/share/applications/io.github.zeuros.gitgud.desktop
      - install -Dm644 io.github.zeuros.gitgud.metainfo.xml
          /app/share/metainfo/io.github.zeuros.gitgud.metainfo.xml
      - for s in 16 32 48 64 128 256 512; do
          install -Dm644 icons/${s}x${s}.png
            /app/share/icons/hicolor/${s}x${s}/apps/io.github.zeuros.gitgud.png;
        done

    sources:
      # x86_64 binary — updated by scripts/update-flatpak-manifest.py on each release
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/zeuros/gitgud/releases/download/v2.12.0/GitGud-2.12.0-Linux-x64.tar.gz
        sha256: 8ba320a311cc1316ed90fc0435b4a3ea65c35aa03c7109fe0a013641d191ce60

      # aarch64 binary — updated by scripts/update-flatpak-manifest.py on each release
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/zeuros/gitgud/releases/download/v2.12.0/GitGud-2.12.0-Linux-arm64.tar.gz
        sha256: 8c3ffc8cb3d104c51b6da0d259143bed19ae5c7421483819a917e7ad08c868f4

      - type: file
        path: io.github.zeuros.gitgud.desktop

      - type: file
        path: io.github.zeuros.gitgud.metainfo.xml

      - type: dir
        path: icons
        dest: icons
