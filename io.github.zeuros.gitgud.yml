app-id: io.github.zeuros.gitgud
# Tauri app: the GNOME runtime provides WebKitGTK 4.1, GTK 3 and libsoup 3 the binary links to
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node26
command: gitgud
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --device=dri
  - --filesystem=home
  - --socket=ssh-auth

modules:
  - name: gitgud
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node26/bin
      env:
        CARGO_HOME: /run/build/gitgud/cargo
        XDG_CACHE_HOME: /run/build/gitgud/flatpak-node/cache
        npm_config_cache: /run/build/gitgud/flatpak-node/npm-cache
        npm_config_offline: "true"
        NG_CLI_ANALYTICS: "false"
    build-commands:
      # Install scripts only check or fetch prebuilt binaries, which the lockfile's platform packages already hold
      - npm ci --offline --ignore-scripts
      - npm run build:angular
      # custom-protocol serves the built frontend, as `tauri build` does; without it the app loads the dev server URL
      - cargo build --release --offline --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/gitgud /app/bin/gitgud
      - install -Dm644 build/flatpak/io.github.zeuros.gitgud.desktop
          /app/share/applications/io.github.zeuros.gitgud.desktop
      - install -Dm644 build/flatpak/io.github.zeuros.gitgud.metainfo.xml
          /app/share/metainfo/io.github.zeuros.gitgud.metainfo.xml
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.zeuros.gitgud.png
      - install -Dm644 src-tauri/icons/64x64.png /app/share/icons/hicolor/64x64/apps/io.github.zeuros.gitgud.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.zeuros.gitgud.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.zeuros.gitgud.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/io.github.zeuros.gitgud.png

    sources:
      - type: archive
        url: https://github.com/zeuros/gitgud/archive/refs/tags/v2.13.1.tar.gz
        sha256: 4951cee2d30c4cce8ee893db975191ad4a138c7e57bf0ca4020bd56f0e6d5f63

      # Generated from the tag's lockfiles by flatpak-builder-tools: flatpak-cargo-generator and flatpak-node-generator
      - cargo-sources.json
      - node-sources.json
