app-id: io.github.zeuros.gitgud
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "24.08"
command: gitgud
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --share=network
  - --device=dri
  - --filesystem=home
  - --socket=ssh-auth
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.OpenURI
  - --talk-name=org.freedesktop.portal.FileChooser
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto

modules:
  - name: gitgud
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/gitgud /app/bin/gitgud
      - install -Dm644 io.github.zeuros.gitgud.desktop
          /app/share/applications/io.github.zeuros.gitgud.desktop
      - install -Dm644 io.github.zeuros.gitgud.metainfo.xml
          /app/share/metainfo/io.github.zeuros.gitgud.metainfo.xml
      - for s in 16 32 48 64 128 256 512; do
          install -Dm644 icons/${s}x${s}.png
            /app/share/icons/hicolor/${s}x${s}/apps/io.github.zeuros.gitgud.png;
        done

    sources:
      # x86_64 binary — updated by scripts/update-flatpak-manifest.py on each release
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/zeuros/gitgud/releases/download/v2.9.2/GitGud-2.9.2-Linux-x64.tar.gz
        sha256: 7397e1dfcde92b1949e4bf9bf4e2ff3aaa31073b265784ef7204638452a01f23

      # aarch64 binary — updated by scripts/update-flatpak-manifest.py on each release
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/zeuros/gitgud/releases/download/v2.9.2/GitGud-2.9.2-Linux-arm64.tar.gz
        sha256: 9e8c59eeee02f793cf4b39e92fc3a8e1af7b41d82622e8ee82f56b1e4d2be7fa

      - type: file
        path: io.github.zeuros.gitgud.desktop

      - type: file
        path: io.github.zeuros.gitgud.metainfo.xml

      - type: dir
        path: icons
        dest: icons
